services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: truthlayer
      POSTGRES_USER: truthlayer
      POSTGRES_PASSWORD: truthlayer
    ports:
      - "5432:5432"
    volumes:
      - truthlayer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthlayer -d truthlayer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  truthlayer-postgres:
