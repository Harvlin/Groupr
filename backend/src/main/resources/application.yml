spring:
  application:
    name: truth-layer-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/truthlayer}
    username: ${DATABASE_USERNAME:truthlayer}
    password: ${DATABASE_PASSWORD:truthlayer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

truthlayer:
  github:
    app-id: ${GITHUB_APP_ID:0}
    app-slug: ${GITHUB_APP_SLUG:}
    private-key: ${GITHUB_PRIVATE_KEY:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    setup-callback-url: ${GITHUB_SETUP_CALLBACK_URL:http://localhost:8080/api/v1/auth/oauth/github/callback}
  google:
    access-token: ${GOOGLE_ACCESS_TOKEN:}
  ai:
    provider: ${AI_PROVIDER:disabled}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:claude-3-5-haiku-latest}
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    token-hours: ${JWT_TOKEN_HOURS:12}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
